# netcup pins podman 5.8.6 (hosts/netcup/default.nix) because 5.8.7 breaks
# Forgejo CI with "path escapes from parent". Watch the upstream issue and open
# an issue here, assigned to the repo owner (→ mail), once it is closed, so the
# pin gets dropped again.
name: podman fix watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Upstream podman issue number to check"
        default: "29805"
  push:
    branches: [main]
    paths: [.github/workflows/podman-fix-watch.yml]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM: podman-container-tools/podman
          NUMBER: ${{ inputs.issue || '29805' }}
        run: |
          set -euo pipefail

          read -r state reason closed_at < <(gh api "repos/$UPSTREAM/issues/$NUMBER" \
            --jq '[.state, (.state_reason // "-"), (.closed_at // "-")] | @tsv')
          echo "$UPSTREAM#$NUMBER: $state ($reason)"
          [ "$state" = closed ] || exit 0

          title="podman#$NUMBER closed: drop the podman 5.8.6 pin on netcup"
          if gh issue list --state all --limit 500 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue already exists"
            exit 0
          fi

          nixpkgs_version=$(curl -fsSL https://raw.githubusercontent.com/NixOS/nixpkgs/nixos-unstable/pkgs/by-name/po/podman/package.nix \
            | sed -nE 's/^\s*version = "([^"]+)";.*/\1/p' | head -1)

          gh issue create \
            --title "$title" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --body "$(cat <<EOF
          https://github.com/$UPSTREAM/issues/$NUMBER was closed on $closed_at (reason: \`$reason\`).

          podman on \`nixos-unstable\` is currently **${nixpkgs_version:-unknown}** (pinned: 5.8.6).

          Once nixpkgs ships a podman release that contains the fix:
          1. Remove the \`nixpkgs-podman\` input from \`flake.nix\` and the podman overlay in \`hosts/netcup/default.nix\`.
          2. \`nix flake update nixpkgs\`, rebuild netcup, and rerun a Forgejo CI job.
          3. Delete \`.github/workflows/podman-fix-watch.yml\`.
          EOF
          )"
